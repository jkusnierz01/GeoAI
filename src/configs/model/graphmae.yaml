_target_: src.models.graphmae_module.GraphMAE

num_heads: 2
num_out_heads: 1
num_hidden: 64
num_layers: 3
residual: true
attn_drop: 0.1
in_drop: 0.2
norm: layernorm
negative_slope: 0.2
encoder: gat
decoder: gat
mask_rate: 0.5
replace_rate: 0.1
drop_edge_rate: 0.1

activation: relu
alpha_l: 1
loss_fn: sce
concat_hidden: false

optimizer: adamw
max_epoch: 500
max_epoch_f: 100
lr: 0.001
weight_decay: 0.0005
lr_f: 0.001
weight_decay_f: 0.0005
linear_prob: false
scheduler: true
num_features: 33